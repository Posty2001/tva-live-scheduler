# Gateway Miss Minutes. Worker ESISTENTE: miss-minutes-api (viene aggiornato, non ricreato).
# Copia del sorgente mantenuto in marvel-timeline/miss-minutes/gateway/. Nessun segreto in questo file.
name = "miss-minutes-api"
main = "worker.ts"
compatibility_date = "2025-08-01"
workers_dev = true
keep_vars = true

[vars]
# Il workflow imposta "yes" SOLO se richiesto esplicitamente con la conferma del piano gratuito.
FREE_TIER_VERIFIED = "no"
APP_ORIGINS = "https://tva-archives-test-1110.netlify.app"
GEMINI_MODEL = "gemini-3.5-flash-lite"
DAILY_CAP = "150"
MONTHLY_CAP = "3000"
IP_DAILY_CAP = "40"
DEVICE_DAILY_CAP = "30"
POW_BITS = "16"

[[durable_objects.bindings]]
name = "LIMITER"
class_name = "Limiter"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Limiter"]

[observability]
enabled = false
